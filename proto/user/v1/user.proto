syntax = "proto3";

package user.v1;

import "google/protobuf/empty.proto";
// import "google/protobuf/timestamp.proto";

// option go_package = "github.com/Chimder/spoti/internal/gen/user;userpb";

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUserByID(GetUserByIDRequest) returns (GetUserByIDResponse);

  rpc FollowPlaylist(FollowPlaylistRequest) returns (google.protobuf.Empty);
  rpc UnfollowPlaylist(UnfollowPlaylistRequest) returns (google.protobuf.Empty);

  rpc FollowArtist(FollowArtistRequest) returns (google.protobuf.Empty);
  rpc UnfollowArtist(UnfollowArtistRequest) returns (google.protobuf.Empty);
}

message Playlist {
  string id = 1;
  string owner_id = 2;

  string name = 3;
  string description = 4;

  int32 disc_number = 5;

  string image = 6;
  bool is_public = 7;

  uint32 total = 8;

  repeated PlaylistTrack tracks = 9;
}

message PlaylistTrack {
  string track_id = 1;
  int32 position = 2;
}

message GetUserByIDRequest {
  string id = 1;
}

message GetUserByIDResponse {
  string id = 1;
  string name = 2;
  string email = 3;
  string image = 4;
  uint32 followers = 5;
  bool premium_status = 6;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string image = 3;
  int32 followers = 4;
  bool premium_status = 5;
}

message CreateUserResponse {
  string id = 1;
}

message FollowPlaylistRequest {
  string user_id = 1;
  string playlist_id = 2;
}

message UnfollowPlaylistRequest {
  string user_id = 1;
  string playlist_id = 2;
}

message FollowArtistRequest {
  string user_id = 1;
  string artist_id = 2;
}

message UnfollowArtistRequest {
  string user_id = 1;
  string artist_id = 2;
}
