services:
  postgres:
    image: postgres
    container_name: spPostgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - spotiData:/var/lib/postgresql
    ports:
      - "5432:5432"

  redis:
    image: redis
    container_name: spRedis
    restart: always
    ports:
      - "6379:6379"

  pgweb:
    image: sosedoff/pgweb
    container_name: spPgweb
    restart: always
    depends_on:
      - postgres
    environment:
      PGWEB_DATABASE_URL: "postgres://postgres:postgres@spPostgres:5432/postgres?sslmode=disable"
    ports:
      - "8081:8081"
  clickhouse:
    image: clickhouse/clickhouse-server
    container_name: spClickhouse
    restart: always
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouseData:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: spMeilisearch
    ports:
      - "7700:7700"
    environment:
      # - MEILI_MASTER_KEY=your-master-key-optional
      - MEILI_ENV=development
    volumes:
      - meili_data:/meili_data

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    restart: unless-stopped
    ports:
      - "8428:8428"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - vmdata:/storage
      - ./promscrape.yml:/etc/vm/promscrape.yml:ro
    command:
      - "--storageDataPath=/storage"
      - "--httpListenAddr=:8428"
      - "--promscrape.config=/etc/vm/promscrape.yml"
      - "--retentionPeriod=1M"
      - "--loggerLevel=INFO"
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - victoriametrics
    configs:
      - source: grafana-datasource
        target: /etc/grafana/provisioning/datasources/vm.yml

configs:
  grafana-datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          type: prometheus
          access: proxy
          url: http://victoriametrics:8428
          isDefault: true
          jsonData:
            timeInterval: 15s
          editable: true
